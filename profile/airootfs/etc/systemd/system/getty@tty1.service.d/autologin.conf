# LEGIT OS - autologin the live desktop user on tty1.
#
# The session runs as a normal user, not root: GNOME applications (Nautilus /
# GNOME Files) refuse to run under the root account. ExecStartPre provisions
# that account before agetty tries to log it in. root is still available with
# its password ("legit") on the other TTYs (Ctrl+Alt+F2...).
[Service]
ExecStartPre=-/usr/local/bin/legit-liveuser-init
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin legit - ${TERM}
