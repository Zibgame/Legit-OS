# LEGIT OS - Hyprland : floating-first configuration.
# No automatic tiling: every window opens floating, then you move / resize it
# freely with the mouse or the keyboard.
# Reference: https://wiki.hyprland.org/Configuring/

# -------- MONITORS --------
monitor=,preferred,auto,auto

# -------- AUTOSTART --------
exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# -------- INPUT --------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# -------- GENERAL --------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(4bb3e4ee)
    col.inactive_border = rgba(44444466)
    allow_tearing = false
}

# -------- DECORATION --------
decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    drop_shadow = true
    shadow_range = 8
}

animations {
    enabled = true
    bezier = fast, 0.5, 0, 0.5, 1
    animation = windows, 1, 3, fast
    animation = windowsOut, 1, 3, fast
    animation = fadeIn, 1, 2, fast
}

# -------- MISC --------
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# -------- WINDOW RULES (floating-first) --------
# Every window opens floating.
windowrulev2 = float, class:(.*)
# Sensible default size; free resize afterwards with the mouse or keyboard.
windowrulev2 = size 1100 750, class:(.*)
# Waybar should not get a border or shadow.
windowrulev2 = noborder, class:(waybar)

# -------- KEYBINDS --------
# TERMINAL
bind = SUPER, RETURN, exec, kitty
# LAUNCHER
bind = SUPER, SPACE, exec, wofi --show drun --insensitive
# CLOSE / FULLSCREEN / TOGGLE FLOATING
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER, T, togglefloating

# FOCUS (SUPER + arrows)
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

# FLOATING WINDOW MOVEMENT (SUPER + SHIFT + arrows)
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

# FLOATING WINDOW RESIZE (SUPER + CTRL + arrows)
bind = SUPER CTRL, LEFT, resizeactive, -40 0
bind = SUPER CTRL, RIGHT, resizeactive, 40 0
bind = SUPER CTRL, UP, resizeactive, 0 -40
bind = SUPER CTRL, DOWN, resizeactive, 0 40

# SCREENSHOT
bind = , PRINT, exec, bash -c 'mkdir -p "$HOME/Pictures"; grim -g "$(slurp)" "$HOME/Pictures/legit-screenshot-$(date +%s).png"'

# WORKSPACES (SUPER + function keys)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# -------- MOUSE BINDS (move / resize floating windows) --------
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
